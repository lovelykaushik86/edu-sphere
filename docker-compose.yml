services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edusphere
      POSTGRES_USER: edusphere
      POSTGRES_PASSWORD: edusphere_local_password
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusphere -d edusphere"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://edusphere:edusphere_local_password@postgres:5432/edusphere?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-development-access-secret-change-before-production-2026
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-before-production-2026
      WEB_URL: http://localhost:4200
      API_PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["4200:80"]
    depends_on: [api]
volumes:
  postgres_data:
